openapi: 3.1.0

# The contract for Invoist's public API. This file is the source of truth
# every SDK is generated from, and TestOpenAPIMatchesRoutes (in
# internal/httpapi) fails the build if it drifts from the routes actually
# registered in server.go. Add an endpoint there, add it here.

info:
  title: Invoist API
  version: "1.0.0"
  summary: Turn invoice images and PDFs into clean, structured JSON.
  description: |
    Upload an invoice, receipt, or payment confirmation and get structured
    data back: header fields, line items, confidence scores, and heuristic
    observations worth a second look.

    Extraction is asynchronous. `POST /v1/extract` responds immediately with
    a document whose extraction is `pending`; poll `GET /v1/documents/{id}`
    or subscribe to the `extraction.completed` webhook.

    All money is integer minor units (cents), never a float. All timestamps
    are RFC 3339 UTC. All dates are `YYYY-MM-DD`.
  contact:
    name: Invoist support
    url: https://invoi.st
  # This description of the API is MIT licensed, so anyone may generate a
  # client from it; the API itself is Invoist's service.
  license:
    name: MIT
    identifier: MIT

servers:
  - url: https://api.invoi.st
    description: Production
  - url: http://localhost:8080
    description: Local development

security:
  - ApiKeyAuth: []

tags:
  - name: Extraction
    description: Submit documents and read their extracted data.
  - name: Documents
    description: List, fetch, and download stored documents.
  - name: Review queue
    description: Items the engine flagged for a human to check.
  - name: Workspace
    description: Categories, usage, and workspace statistics.
  - name: Webhooks
    description: Register endpoints that receive signed events (REST hooks).
  - name: Bills
    description: |
      A household's bills (Invoist Personal). These routes answer only a
      household's key, which holds `bills:read` (and `bills:write` when the
      person allowed marking bills paid); every other route refuses it.

paths:
  /v1/extract:
    post:
      operationId: extractDocument
      tags: [Extraction]
      summary: Submit a document for extraction
      description: |
        Accepts a PDF, PNG, or JPEG up to 20 MB as multipart form data.

        Returns immediately with `extraction.status` set to `pending`:
        reading the document happens in the background. Poll
        `GET /v1/documents/{id}` or handle the `extraction.completed`
        webhook rather than blocking on this call.

        Uploading a file this workspace has already extracted returns the
        existing document with `200` and `duplicate: true`, instead of
        creating a second record and charging for a second extraction. That
        makes retrying a request whose response you never received safe: the
        same bytes always resolve to the same document.

        A test-mode key (create one in the dashboard under API keys) skips
        all of the above: it returns `extraction.status: "done"` immediately,
        with a fixed fixture result, no vision call, and no usage charged.
        Sandbox documents never appear in a live key's or the dashboard's
        `GET /v1/documents` or `GET /v1/review-queue`, and a live key can
        never fetch one by id — the isolation runs both directions.

        An `Idempotency-Key` header covers the case duplicate-detection
        doesn't: retrying with logically-the-same-but-byte-different content
        (a re-encoded export, a file read from disk again). The first
        request with a given key is billed and processed normally; every
        later request with the same key gets that exact response replayed
        (`Idempotency-Replayed: true`), no new document, no new charge.
        Reusing a key with different file bytes is rejected with `422`
        rather than silently answering with a stale result. Keys expire
        after 24 hours.
      security:
        - ApiKeyAuth: [documents:write]
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          schema: { type: string, maxLength: 255 }
          description: >-
            A key you generate per logical request. Reusing it with the same
            file replays the first response; reusing it with a different
            file is rejected with 422.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: The invoice file. PDF, PNG, or JPEG, under 20 MB.
      responses:
        "200":
          description: >-
            These exact bytes were already extracted in this workspace. The
            existing document is returned and nothing new was created or
            billed.
          content:
            application/json:
              schema:
                type: object
                required: [document, duplicate]
                properties:
                  document: { $ref: "#/components/schemas/Document" }
                  extraction: { $ref: "#/components/schemas/Extraction" }
                  duplicate:
                    type: boolean
                    const: true
        "201":
          description: Document accepted and queued for extraction.
          content:
            application/json:
              schema:
                type: object
                required: [document, extraction, duplicate]
                properties:
                  document: { $ref: "#/components/schemas/Document" }
                  extraction: { $ref: "#/components/schemas/Extraction" }
                  duplicate:
                    type: boolean
                    const: false
                    description: >-
                      Always false here. Present so callers can branch on one
                      field rather than on the status code.
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "413":
          description: The file is larger than 20 MB.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "415":
          description: Unsupported file type. Use PDF, PNG, or JPEG.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422":
          description: >-
            The Idempotency-Key header was already used with a different
            file. Generate a new key for a genuinely different request.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503":
          description: File storage is not configured on this deployment.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /v1/extract/batch:
    post:
      operationId: extractDocumentBatch
      tags: [Extraction]
      summary: Submit up to 10 documents in one call
      description: |
        Multipart form data, one or more files under the field name
        `files` (repeat the field for each one), up to 10 files per
        request. Each file goes through exactly the same pipeline as
        `POST /v1/extract` — the same duplicate detection, the same sandbox
        handling for a test-mode key, a `document.created` webhook per new
        document — so this behaves like N calls to the single endpoint in
        one round trip.

        Always answers `200`. One bad file does not fail the batch: each
        entry in `results` carries its own outcome, in the same order the
        files were sent, and `accepted`/`rejected` sum to the number of
        files submitted. `Idempotency-Key` is not supported here — it names
        one logical request, and a batch is several at once.
      security:
        - ApiKeyAuth: [documents:write]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [files]
              properties:
                files:
                  type: array
                  minItems: 1
                  maxItems: 10
                  items: { type: string, format: binary }
                  description: One to ten invoice files. PDF, PNG, or JPEG, each under 20 MB.
      responses:
        "200":
          description: Every file's individual outcome. The request itself always succeeds if it reached this far.
          content:
            application/json:
              schema:
                type: object
                required: [results, accepted, rejected]
                properties:
                  results:
                    type: array
                    items: { $ref: "#/components/schemas/BatchResultItem" }
                  accepted: { type: integer, description: How many files were accepted and queued. }
                  rejected: { type: integer, description: How many files failed validation or could not be stored. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503":
          description: File storage is not configured on this deployment.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /v1/documents:
    get:
      operationId: listDocuments
      tags: [Documents]
      summary: List documents
      security:
        - ApiKeyAuth: [documents:read]
      parameters:
        - name: limit
          in: query
          description: Maximum rows to return. Defaults to 50, capped at 200.
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
        - name: offset
          in: query
          schema: { type: integer, minimum: 0, default: 0 }
        - name: status
          in: query
          description: Filter by document status.
          schema: { $ref: "#/components/schemas/DocumentStatus" }
        - name: flagged
          in: query
          description: Only documents with pending review items. Pass `1` or `true`.
          schema: { type: string }
        - name: q
          in: query
          description: Case-insensitive match on filename, vendor, invoice number, or reference.
          schema: { type: string }
        - name: category
          in: query
          description: A category id, or the literal `none` for uncategorized only.
          schema: { type: string }
      responses:
        "200":
          description: A page of documents.
          content:
            application/json:
              schema:
                type: object
                required: [documents]
                properties:
                  documents:
                    type: array
                    items: { $ref: "#/components/schemas/DocumentListItem" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /v1/documents/{id}:
    get:
      operationId: getDocument
      tags: [Documents]
      summary: Fetch a document with its extraction
      description: |
        The `extraction` field is absent until an extraction row exists, and
        carries `status: "pending"` until reading finishes. Poll this endpoint
        to await a result.
      security:
        - ApiKeyAuth: [documents:read]
      parameters:
        - $ref: "#/components/parameters/DocumentId"
      responses:
        "200":
          description: The document, its extraction, and any review items.
          content:
            application/json:
              schema:
                type: object
                required: [document, review_queue]
                properties:
                  document: { $ref: "#/components/schemas/Document" }
                  extraction: { $ref: "#/components/schemas/Extraction" }
                  extraction_job: { $ref: "#/components/schemas/ExtractionJob" }
                  review_queue:
                    type: array
                    items: { $ref: "#/components/schemas/ReviewQueueItem" }
                  period_locked:
                    type: boolean
                    description: >-
                      Whether this document's month is closed. A locked
                      document can be read and exported but not edited,
                      categorized, deleted, or re-run until the month is
                      reopened.
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /v1/documents/{id}/file:
    get:
      operationId: getDocumentFile
      tags: [Documents]
      summary: Download the original file
      description: Streams the bytes exactly as uploaded, with the stored content type.
      security:
        - ApiKeyAuth: [documents:read]
      parameters:
        - $ref: "#/components/parameters/DocumentId"
      responses:
        "200":
          description: The original file.
          content:
            application/pdf:
              schema: { type: string, format: binary }
            image/png:
              schema: { type: string, format: binary }
            image/jpeg:
              schema: { type: string, format: binary }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /v1/review-queue:
    get:
      operationId: listReviewQueue
      tags: [Review queue]
      summary: List review-queue items
      description: |
        Items the engine flagged for a human to check. Reasons cover both
        extraction quality (low confidence, totals that did not reconcile)
        and risk (changed bank details, an amount outside a vendor's usual
        range, a suspected duplicate, or a rule the workspace configured).
      security:
        - ApiKeyAuth: [review:read]
      parameters:
        - name: status
          in: query
          description: Filter by item status. Omit for all.
          schema: { $ref: "#/components/schemas/ReviewStatus" }
      responses:
        "200":
          description: Matching review items, with a summary of their document.
          content:
            application/json:
              schema:
                type: object
                required: [review_queue]
                properties:
                  review_queue:
                    type: array
                    items: { $ref: "#/components/schemas/ReviewQueueListItem" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /v1/review-queue/{id}/resolve:
    post:
      operationId: resolveReviewQueueItem
      tags: [Review queue]
      summary: Resolve or dismiss a review item
      security:
        - ApiKeyAuth: [review:write]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  description: Defaults to `resolved` when omitted.
                  type: string
                  enum: [resolved, dismissed]
      responses:
        "200":
          description: The updated item.
          content:
            application/json:
              schema:
                type: object
                required: [review_queue_item]
                properties:
                  review_queue_item: { $ref: "#/components/schemas/ReviewQueueItem" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /v1/categories:
    get:
      operationId: listCategories
      tags: [Workspace]
      summary: List spend categories
      description: The categories documents are sorted into. Every workspace starts with a seeded set.
      security:
        - ApiKeyAuth: [workspace:read]
      responses:
        "200":
          description: The workspace's categories.
          content:
            application/json:
              schema:
                type: object
                required: [categories]
                properties:
                  categories:
                    type: array
                    items: { $ref: "#/components/schemas/Category" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /v1/usage:
    get:
      operationId: getUsage
      tags: [Workspace]
      summary: Usage for the current billing period
      security:
        - ApiKeyAuth: [usage:read]
      responses:
        "200":
          description: Usage totals and a per-day breakdown.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Usage" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /v1/stats/overview:
    get:
      operationId: getStatsOverview
      tags: [Workspace]
      summary: Workspace statistics
      security:
        - ApiKeyAuth: [stats:read]
      responses:
        "200":
          description: Document counts, pending review count, and plan allowance.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StatsOverview" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /v1/webhook-endpoints:
    get:
      operationId: listWebhookEndpoints
      tags: [Webhooks]
      summary: List webhook endpoints
      security:
        - ApiKeyAuth: [webhooks:manage]
      responses:
        "200":
          description: Every registered endpoint, plus the event catalogue.
          content:
            application/json:
              schema:
                type: object
                required: [endpoints, known_events]
                properties:
                  endpoints:
                    type: array
                    items: { $ref: "#/components/schemas/WebhookEndpoint" }
                  known_events:
                    type: array
                    items: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/RateLimited" }
    post:
      operationId: createWebhookEndpoint
      tags: [Webhooks]
      summary: Register a webhook endpoint
      description: >-
        Subscribes a URL to signed events. This is the REST-hook subscribe used
        by Zapier, Make and n8n. The response is the only time the signing
        secret is ever returned.
      security:
        - ApiKeyAuth: [webhooks:manage]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [url]
              properties:
                url: { type: string, description: HTTP or HTTPS receiver. }
                description: { type: string }
                events:
                  type: array
                  items: { type: string }
                  description: Event types, or ["*"] for everything. Defaults to everything.
      responses:
        "201":
          description: The endpoint, including its one-time signing secret.
          content:
            application/json:
              schema:
                type: object
                required: [endpoint]
                properties:
                  endpoint: { $ref: "#/components/schemas/WebhookEndpointWithSecret" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /v1/webhook-endpoints/{id}:
    delete:
      operationId: deleteWebhookEndpoint
      tags: [Webhooks]
      summary: Remove a webhook endpoint
      description: The REST-hook unsubscribe. Deliveries to it stop immediately.
      security:
        - ApiKeyAuth: [webhooks:manage]
      parameters:
        - $ref: "#/components/parameters/WebhookEndpointId"
      responses:
        "204": { description: Removed. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /v1/bills:
    get:
      operationId: listBills
      tags: [Bills]
      summary: List the household's bills
      description: |
        Every bill the household has added, as the app lists them. A reminder
        or collection letter linked to a bill is folded into that bill's row
        (see `letter`) rather than listed on its own; a search lists them too.
        Unpaid bills come soonest-due first.
      security:
        - ApiKeyAuth: [bills:read]
      parameters:
        - name: paid
          in: query
          description: "`true` for bills marked paid, `false` for bills still to pay; omit for both."
          schema: { type: boolean }
        - name: month
          in: query
          description: Only the bills of this month (`YYYY-MM`), by due date, or the bill's own date when it has none.
          schema: { type: string, pattern: "^[0-9]{4}-[0-9]{2}$" }
        - name: sender
          in: query
          description: Only this sender's bills, matched without regard to case or spacing.
          schema: { type: string }
        - name: q
          in: query
          description: Case-insensitive match on filename, sender, bill number, or reference. Searches every month.
          schema: { type: string }
        - name: limit
          in: query
          description: Maximum rows to return. Defaults to 50, capped at 200.
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
        - name: offset
          in: query
          schema: { type: integer, minimum: 0, default: 0 }
      responses:
        "200":
          description: A page of bills.
          content:
            application/json:
              schema:
                type: object
                required: [bills]
                properties:
                  bills:
                    type: array
                    items: { $ref: "#/components/schemas/Bill" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /v1/bills/summary:
    get:
      operationId: getBillsSummary
      tags: [Bills]
      summary: What there is to pay
      description: How many bills are unpaid and overdue, and what falls due in the next `days` days, per currency.
      security:
        - ApiKeyAuth: [bills:read]
      parameters:
        - name: today
          in: query
          description: The household's own date (`YYYY-MM-DD`), within two days of the server's. Defaults to the server's.
          schema: { type: string, format: date }
        - name: days
          in: query
          description: How far ahead "due soon" reaches. Defaults to 30.
          schema: { type: integer, minimum: 1, maximum: 366, default: 30 }
      responses:
        "200":
          description: The summary.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BillsSummary" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /v1/bills/stats:
    get:
      operationId: getBillsStats
      tags: [Bills]
      summary: A month at a glance
      description: |
        The month's totals (billed and paid, per currency), the twelve months
        up to it, the five biggest senders, and every sender with a count.
        A reminder counts at its newest amount as part of its bill; receipts,
        payment confirmations and credit notes are not counted.
      security:
        - ApiKeyAuth: [bills:read]
      parameters:
        - name: month
          in: query
          description: The month (`YYYY-MM`). Defaults to the current one.
          schema: { type: string, pattern: "^[0-9]{4}-[0-9]{2}$" }
        - name: sender
          in: query
          description: Narrow the totals and the trend to one sender.
          schema: { type: string }
      responses:
        "200":
          description: The month.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BillsStats" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /v1/bills/{id}:
    get:
      operationId: getBill
      tags: [Bills]
      summary: Everything about one bill
      description: |
        The bill with everything read from it, its open warnings, the
        household's record (paid, by whom, who pays), and its letters.
      security:
        - ApiKeyAuth: [bills:read]
      parameters:
        - $ref: "#/components/parameters/DocumentId"
      responses:
        "200":
          description: The bill.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BillDetail" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /v1/bills/{id}/file:
    get:
      operationId: getBillFile
      tags: [Bills]
      summary: Download the original bill
      description: Streams the bytes exactly as added, with the stored content type.
      security:
        - ApiKeyAuth: [bills:read]
      parameters:
        - $ref: "#/components/parameters/DocumentId"
      responses:
        "200":
          description: The original file.
          content:
            application/pdf:
              schema: { type: string, format: binary }
            image/png:
              schema: { type: string, format: binary }
            image/jpeg:
              schema: { type: string, format: binary }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /v1/bills/{id}/paid:
    post:
      operationId: markBillPaid
      tags: [Bills]
      summary: Mark a bill as paid
      description: |
        Records the bill, and its letters, as paid by the person who created
        the key. Needs `bills:write`, which a household grants only when it
        allows its key or assistant to mark bills paid.
      security:
        - ApiKeyAuth: [bills:write]
      parameters:
        - $ref: "#/components/parameters/DocumentId"
      responses:
        "200":
          description: The household's record after the change.
          content:
            application/json:
              schema:
                type: object
                required: [bill]
                properties:
                  bill: { $ref: "#/components/schemas/BillRecord" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }
    delete:
      operationId: unmarkBillPaid
      tags: [Bills]
      summary: Mark a bill as not paid
      security:
        - ApiKeyAuth: [bills:write]
      parameters:
        - $ref: "#/components/parameters/DocumentId"
      responses:
        "200":
          description: The household's record after the change.
          content:
            application/json:
              schema:
                type: object
                required: [bill]
                properties:
                  bill: { $ref: "#/components/schemas/BillRecord" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /v1/held-emails:
    get:
      operationId: listHeldEmails
      tags: [Bills]
      summary: Emails waiting for approval
      description: |
        Bills forwarded to the household's address that wait for a person to
        approve their sender, or for a plan. Read-only: approving a sender is
        done in the app.
      security:
        - ApiKeyAuth: [bills:read]
      responses:
        "200":
          description: The waiting emails, oldest first.
          content:
            application/json:
              schema:
                type: object
                required: [held_emails]
                properties:
                  held_emails:
                    type: array
                    items: { $ref: "#/components/schemas/HeldEmail" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/RateLimited" }

components:
  securitySchemes:
    ApiKeyAuth:
      type: http
      scheme: bearer
      description: |
        Send your workspace API key as `Authorization: Bearer inv_sk_...`.
        Keys are created in the dashboard under Integrations (a household's
        under Settings, AI assistants), and are shown once at creation. An
        OAuth access token (`inv_at_...`) works the same way.

  parameters:
    DocumentId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    WebhookEndpointId:
      name: id
      in: path
      required: true
      description: The webhook endpoint's id.
      schema: { type: string, format: uuid }

  responses:
    BadRequest:
      description: The request was malformed.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unauthorized:
      description: Missing, malformed, or revoked API key.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Forbidden:
      description: The key is valid but lacks the scope this endpoint requires.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: No such resource in this workspace.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    RateLimited:
      description: Too many requests. Check the `Retry-After` header.
      headers:
        Retry-After:
          description: Seconds to wait before retrying.
          schema: { type: integer }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

  schemas:
    ErrorDetail:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: A stable machine-readable identifier. Branch on this, not the message.
          examples: [invalid_body, unauthenticated, forbidden, not_found, upload_too_large]
        message:
          type: string
          description: Human-readable explanation. Wording may change; do not parse it.

    Error:
      type: object
      required: [error]
      properties:
        error: { $ref: "#/components/schemas/ErrorDetail" }

    BatchResultItem:
      type: object
      required: [filename]
      description: >-
        One file's outcome from POST /v1/extract/batch. A rejected file
        carries `error` and omits the document fields; an accepted one
        carries the document fields and omits `error`.
      properties:
        filename: { type: string }
        document_id: { type: string, format: uuid }
        extraction_id: { type: string, format: uuid }
        status: { $ref: "#/components/schemas/DocumentStatus" }
        duplicate:
          type: boolean
          description: True when this file's bytes were already extracted in this workspace.
        error:
          allOf: [{ $ref: "#/components/schemas/ErrorDetail" }]
          description: Present only when this file was rejected.

    DocumentStatus:
      type: string
      enum: [pending, processing, done, failed]

    DocumentSource:
      type: string
      description: How the document arrived.
      enum: [api, dashboard, email, storage, sandbox]

    Document:
      type: object
      required: [id, source, original_filename, content_type, byte_size, status, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        source: { $ref: "#/components/schemas/DocumentSource" }
        original_filename: { type: string }
        content_type: { type: string, examples: ["application/pdf"] }
        byte_size: { type: integer, format: int64 }
        status: { $ref: "#/components/schemas/DocumentStatus" }
        approval: { $ref: "#/components/schemas/DocumentApproval" }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    DocumentApproval:
      type: object
      description: >-
        Sign-off state. Separate from `status`, which tracks extraction: this is
        a person's judgement, that is the machine's progress. Always "draft"
        unless the workspace has an approval mode switched on.
      required: [state]
      properties:
        state:
          type: string
          enum: [draft, ready, approved, changes_requested]
        submitted_by: { type: [string, "null"], format: uuid }
        submitted_by_name:
          type: [string, "null"]
          description: Captured at the time, so it survives the person leaving.
        submitted_at: { type: [string, "null"], format: date-time }
        approved_by: { type: [string, "null"], format: uuid }
        approved_by_name: { type: [string, "null"] }
        approved_at: { type: [string, "null"], format: date-time }

    DocumentListItem:
      description: A document plus a flat summary of its latest extraction.
      type: object
      required: [id, source, original_filename, content_type, byte_size, status, pending_review, flagged, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        source: { $ref: "#/components/schemas/DocumentSource" }
        original_filename: { type: string }
        content_type: { type: string }
        byte_size: { type: integer, format: int64 }
        status: { $ref: "#/components/schemas/DocumentStatus" }
        vendor_name: { type: [string, "null"] }
        invoice_number: { type: [string, "null"] }
        reference_number: { type: [string, "null"] }
        total_cents: { type: [integer, "null"], format: int64 }
        base_currency:
          type: [string, "null"]
          description: >-
            The workspace's reporting currency, when one is configured. Null
            when conversion is off, or when this invoice's currency had no
            published rate for its date. The invoice's own currency and
            total_cents remain authoritative.
        base_total_cents:
          type: [integer, "null"]
          format: int64
          description: total_cents converted into base_currency, for reporting only.
        fx_rate:
          type: [string, "null"]
          description: >-
            Reporting-currency units per one unit of the invoice currency, as a
            decimal string so the exact stored value round-trips.
        fx_rate_date:
          type: [string, "null"]
          format: date
          description: >-
            The date of the published rates used, which is the invoice date or
            the most recent publication before it.
        fx_source:
          type: [string, "null"]
          description: Who published the rate, e.g. "ecb".
        currency: { type: [string, "null"] }
        category_id: { type: [string, "null"], format: uuid }
        category_name: { type: [string, "null"] }
        pending_review: { type: integer, description: Count of unresolved review items. }
        flagged: { type: boolean, description: True when pending_review is above zero. }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    ExtractionStatus:
      type: string
      enum: [pending, done, failed]

    Extraction:
      type: object
      required: [id, document_id, engine, status, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        document_id: { type: string, format: uuid }
        engine: { type: string, examples: ["invoist-extraction-v1"] }
        status: { $ref: "#/components/schemas/ExtractionStatus" }
        document_kind:
          type: [string, "null"]
          description: >-
            What the document is. Null when the reader could not tell, and on
            documents read before this field existed; treat null as an
            ordinary invoice.
          enum: [invoice, reminder, debt_collection, credit_note, receipt, payment_confirmation, null]
        invoice_number: { type: [string, "null"] }
        invoice_date: { type: string, format: date, description: Absent when not printed on the document. }
        due_date: { type: string, format: date, description: Absent when not printed on the document. }
        po_number: { type: [string, "null"] }
        reference_number:
          type: [string, "null"]
          description: The payment or bank reference, distinct from the invoice number.
        vendor_name: { type: [string, "null"] }
        vendor_address: { type: [string, "null"] }
        customer_name: { type: [string, "null"] }
        currency: { type: [string, "null"], description: "ISO 4217 code, e.g. EUR." }
        subtotal_cents: { type: [integer, "null"], format: int64 }
        tax_cents: { type: [integer, "null"], format: int64 }
        total_cents: { type: [integer, "null"], format: int64 }
        base_currency:
          type: [string, "null"]
          description: >-
            The workspace's reporting currency, when one is configured. Null
            when conversion is off, or when this invoice's currency had no
            published rate for its date.
        base_total_cents:
          type: [integer, "null"]
          format: int64
          description: total_cents converted into base_currency, for reporting only.
        fx_rate:
          type: [string, "null"]
          description: Reporting-currency units per one unit of the invoice currency, as a decimal string.
        fx_rate_date:
          type: [string, "null"]
          format: date
          description: The date of the published rates used.
        fx_source:
          type: [string, "null"]
          description: Who published the rate, e.g. "ecb".
        confidence:
          type: [object, "null"]
          description: Per-field confidence between 0 and 1, keyed by field name.
          additionalProperties: { type: number }
        line_items:
          type: [array, "null"]
          items: { $ref: "#/components/schemas/LineItem" }
        details:
          type: [object, "null"]
          description: >-
            Optional commercial extras (payment terms, tax IDs, IBAN,
            shipping). On a reminder, collection letter or credit note it also
            carries original_invoice_number, original_invoice_date,
            original_creditor, original_amount_cents, fees_cents and
            interest_cents: the earlier invoice it is about and what was added.
          additionalProperties: true
        fraud_indicators:
          type: [array, "null"]
          description: |
            Heuristic observations worth a second look. Never a determination
            that a document is fraudulent.
          items: { $ref: "#/components/schemas/FraudIndicator" }
        file_metadata:
          type: [object, "null"]
          description: Facts read from the file's own EXIF or PDF metadata, never inferred.
          additionalProperties: true
        custom:
          type: array
          description: Workspace-declared custom fields, filled during extraction.
          items: { $ref: "#/components/schemas/CustomValue" }
        discoveries:
          type: array
          description: Coordinate-pinned findings on the first page image.
          items: { $ref: "#/components/schemas/Discovery" }
        quality: { $ref: "#/components/schemas/Quality" }
        category_id: { type: [string, "null"], format: uuid }
        category_source:
          type: [string, "null"]
          description: Who chose the category.
          enum: [model, user, memory, null]
        auto_approved:
          type: boolean
          description: True when this skipped the review queue because the vendor had a clean track record.
        error_message: { type: [string, "null"] }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        edited_at:
          type: string
          format: date-time
          description: >-
            When a person last corrected these fields by hand. Absent if the
            extraction has never been edited, so its presence is how you tell a
            human-reviewed record from a purely automatic one.

    ExtractionJob:
      type: object
      description: >-
        Progress of the background run that produces an extraction. Reading a
        document is queued work, so this reports how that work is going:
        whether it is waiting, running, finished, or has given up.
      required: [status, attempt_count, max_attempts, retryable]
      properties:
        status:
          type: string
          enum: [queued, running, succeeded, failed]
          description: >-
            `queued` is waiting for a worker, which includes waiting out the
            backoff between attempts. `failed` means every attempt was used or
            the failure was one that retrying cannot fix.
        attempt_count:
          type: integer
          description: Attempts made so far, including the one currently running.
        max_attempts:
          type: integer
          description: >-
            Attempts allowed before the run is abandoned. Deliberately small,
            since every attempt is a real extraction.
        retryable:
          type: boolean
          description: >-
            True when the run has stopped and can be started again. Retrying is
            a fresh run and is billed as one.
        next_attempt_at:
          type: string
          format: date-time
          description: >-
            When the next attempt is due. Present only while a retry is
            genuinely still coming, so its absence on a queued job means the
            job has not started yet rather than that it is stalled.

    LineItem:
      type: object
      required: [description, quantity]
      properties:
        description: { type: string }
        quantity: { type: number }
        unit: { type: [string, "null"] }
        sku: { type: [string, "null"] }
        unit_price_cents:
          type: [integer, "null"]
          format: int64
          description: >-
            Unit price in whole cents. Null when the price is not an exact
            number of cents, which happens on utility and fuel invoices priced
            per unit below one cent. Read unit_price_micros for those.
        unit_price_micros:
          type: [integer, "null"]
          format: int64
          description: >-
            Unit price in millionths of one currency unit, exact for sub-cent
            prices. 8.72 cents per kWh is 87200. Set whenever a unit price is
            printed, including when unit_price_cents is also set.
        line_total_cents: { type: [integer, "null"], format: int64 }
        tax_cents: { type: [integer, "null"], format: int64 }
        discount_cents: { type: [integer, "null"], format: int64 }

    FraudIndicator:
      type: object
      required: [signal, severity, description, source]
      properties:
        signal:
          type: string
          description: |
            Model-reported signals are one of `math_mismatch`,
            `font_inconsistency`, `implausible_dates`, `round_total`,
            `vendor_details_off`, `possible_edit`. Engine-reported signals
            add `vendor_bank_change` and `vendor_amount_anomaly`.
        severity: { type: string, enum: [low, medium, high] }
        description: { type: string }
        source:
          type: string
          description: "`model` when read off the page; `engine` when derived from workspace history."
          enum: [model, engine]
        page: { type: [integer, "null"], description: 1-based page number when the finding has a location. }
        box: { $ref: "#/components/schemas/RegionBox" }

    RegionBox:
      type: [object, "null"]
      description: A rectangle on the page image, normalized 0 to 1, origin top-left.
      required: [x, y, w, h]
      properties:
        x: { type: number }
        y: { type: number }
        w: { type: number }
        h: { type: number }

    WebhookEndpoint:
      type: object
      required: [id, url, description, events, enabled, consecutive_failures, created_at]
      properties:
        id: { type: string, format: uuid }
        url: { type: string }
        description: { type: string }
        events:
          type: array
          items: { type: string }
          description: Subscribed event types; ["*"] means everything.
        enabled: { type: boolean }
        consecutive_failures: { type: integer }
        last_delivery_at: { type: [string, "null"], format: date-time }
        last_status: { type: [integer, "null"] }
        auto_disabled_at:
          type: [string, "null"]
          format: date-time
          description: Set when repeated failures paused this endpoint automatically.
        created_at: { type: string, format: date-time }

    WebhookEndpointWithSecret:
      allOf:
        - $ref: "#/components/schemas/WebhookEndpoint"
        - type: object
          required: [secret]
          properties:
            secret:
              type: string
              description: >-
                HMAC key for X-Invoist-Signature. Returned only here and on
                rotation, never readable again.

    Discovery:
      type: object
      required: [x, y, label]
      properties:
        page:
          type: integer
          description: >-
            1-based page this pin belongs to. Absent or 0 means page 1, which
            is how discoveries extracted before multi-page support are stored.
        x: { type: number, description: Normalized 0 to 1 across that page's image. }
        y: { type: number, description: Normalized 0 to 1 down that page's image. }
        label: { type: string }

    CustomValue:
      type: object
      required: [key, label]
      properties:
        key: { type: string }
        label: { type: string }
        value: { type: [string, "null"] }
        confidence: { type: [number, "null"] }

    Quality:
      type: [object, "null"]
      required: [readability, issues]
      properties:
        readability: { type: number, description: "0 to 1, where 1 is crisp and fully legible." }
        issues:
          type: array
          items:
            type: string
            enum: [blurry, cropped, low_contrast, rotated, handwritten, partial]

    ReviewStatus:
      type: string
      enum: [pending, resolved, dismissed]

    ReviewReason:
      type: string
      description: Why the item was flagged.
      enum:
        - low_confidence
        - total_mismatch
        - poor_quality
        - duplicate
        - unusual_vendor
        - bank_details_changed
        - amount_anomaly
        - amount_over_limit
        - missing_po_number

    ReviewQueueItem:
      type: object
      required: [id, document_id, extraction_id, reason, status, created_at]
      properties:
        id: { type: string, format: uuid }
        document_id: { type: string, format: uuid }
        extraction_id: { type: string, format: uuid }
        reason: { $ref: "#/components/schemas/ReviewReason" }
        status: { $ref: "#/components/schemas/ReviewStatus" }
        created_at: { type: string, format: date-time }
        resolved_at: { type: string, format: date-time }

    ReviewQueueListItem:
      description: A review item plus a summary of the document it belongs to.
      type: object
      required: [id, document_id, extraction_id, reason, status, created_at, original_filename, content_type, document_status]
      properties:
        id: { type: string, format: uuid }
        document_id: { type: string, format: uuid }
        extraction_id: { type: string, format: uuid }
        reason: { $ref: "#/components/schemas/ReviewReason" }
        status: { $ref: "#/components/schemas/ReviewStatus" }
        created_at: { type: string, format: date-time }
        resolved_at: { type: string, format: date-time }
        original_filename: { type: string }
        content_type: { type: string }
        document_status: { $ref: "#/components/schemas/DocumentStatus" }
        vendor_name: { type: [string, "null"] }
        invoice_number: { type: [string, "null"] }
        reference_number: { type: [string, "null"] }
        total_cents: { type: [integer, "null"], format: int64 }
        currency: { type: [string, "null"] }

    Category:
      type: object
      required: [id, name, is_default, created_at]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        is_default: { type: boolean, description: Part of the set seeded with the workspace. }
        created_at: { type: string, format: date-time }

    Usage:
      type: object
      required: [period_start, total_calls, total_documents, total_cost_cents, by_day]
      properties:
        period_start: { type: string, format: date-time }
        total_calls: { type: integer }
        total_documents: { type: integer }
        total_cost_cents: { type: integer, format: int64 }
        by_day:
          type: array
          items:
            type: object
            properties:
              day: { type: string, format: date }
              calls: { type: integer }
              documents: { type: integer }

    StatsOverview:
      type: object
      required: [documents_this_month, documents_total, pending_review_count, period_start, plan]
      properties:
        documents_this_month: { type: integer }
        documents_total: { type: integer }
        pending_review_count: { type: integer }
        period_start: { type: string, format: date-time }
        plan: { type: string, enum: [starter, growth, scale] }
        documents_included:
          type: integer
          description: Monthly allowance for the plan. Absent for plans without a fixed allowance.

    BillRecord:
      description: The household's own record on a bill.
      type: object
      required: [paid_at, paid_by, assigned_to]
      properties:
        paid_at: { type: [string, "null"], format: date-time, description: When it was marked paid. }
        paid_by: { type: [string, "null"], format: uuid, description: Who marked it paid. }
        assigned_to: { type: [string, "null"], format: uuid, description: Who is meant to pay it. }

    BillKind:
      description: What a document is. Null is an ordinary invoice.
      type: [string, "null"]
      enum: [invoice, reminder, debt_collection, credit_note, receipt, payment_confirmation, null]

    BillRelated:
      description: The bill a letter or receipt is linked to, and how.
      type: object
      required: [document_id, link]
      properties:
        document_id: { type: [string, "null"], format: uuid }
        link:
          type: string
          description: "`matched` or `confirmed` when linked, `suggested` when Invoist only thinks so, empty when unlinked."

    BillLetter:
      description: The newest reminder or collection letter about a bill, which says what is owed now.
      type: object
      required: [document_id, kind, count]
      properties:
        document_id: { type: string, format: uuid }
        kind: { type: string, enum: [reminder, debt_collection] }
        total_cents: { type: [integer, "null"], format: int64 }
        currency: { type: [string, "null"] }
        due_date: { type: [string, "null"], format: date }
        added_cents: { type: [integer, "null"], format: int64, description: Fees and interest added on top of the original. }
        count: { type: integer, description: How many letters came for this bill. }

    Bill:
      description: One bill in a household's list.
      allOf:
        - $ref: "#/components/schemas/DocumentListItem"
        - type: object
          required: [bill, kind, related, letter, logo]
          properties:
            due_date: { type: [string, "null"], format: date }
            bill: { $ref: "#/components/schemas/BillRecord" }
            kind: { $ref: "#/components/schemas/BillKind" }
            related: { $ref: "#/components/schemas/BillRelated" }
            letter:
              oneOf:
                - $ref: "#/components/schemas/BillLetter"
                - type: "null"
            proof_document_id:
              type: [string, "null"]
              format: uuid
              description: A receipt or payment confirmation found for this bill.
            logo:
              type: [string, "null"]
              description: >-
                The domain whose logo stands for the sender, when Invoist shows
                one: never on a bill with an open warning, never for a domain
                that imitates another the household knows.

    BillChainMember:
      description: One document of a bill's chain (the bill and its letters).
      type: object
      required: [document_id, kind, status, original_filename, date]
      properties:
        document_id: { type: string, format: uuid }
        kind: { $ref: "#/components/schemas/BillKind" }
        link: { type: [string, "null"] }
        status: { $ref: "#/components/schemas/DocumentStatus" }
        original_filename: { type: string }
        vendor_name: { type: [string, "null"] }
        invoice_number: { type: [string, "null"] }
        reference_number: { type: [string, "null"] }
        currency: { type: [string, "null"] }
        total_cents: { type: [integer, "null"], format: int64 }
        date: { type: string, format: date }
        due_date: { type: [string, "null"], format: date }
        paid_at: { type: [string, "null"], format: date-time }
        fees_cents: { type: [integer, "null"], format: int64 }
        interest_cents: { type: [integer, "null"], format: int64 }
        original_amount_cents: { type: [integer, "null"], format: int64 }
        original_creditor: { type: [string, "null"] }
        vendor_iban: { type: [string, "null"] }
        vendor_bic: { type: [string, "null"] }
        payment_account: { type: [string, "null"] }
        warnings:
          type: array
          items:
            type: object
            required: [id, reason]
            properties:
              id: { type: string, format: uuid }
              reason: { $ref: "#/components/schemas/ReviewReason" }

    BillDetail:
      description: One bill with everything read from it.
      type: object
      required: [document, review_queue, bill]
      properties:
        document: { $ref: "#/components/schemas/Document" }
        extraction: { $ref: "#/components/schemas/Extraction" }
        extraction_job: { $ref: "#/components/schemas/ExtractionJob" }
        review_queue:
          type: array
          description: The bill's warnings; open ones have status `pending`.
          items: { $ref: "#/components/schemas/ReviewQueueItem" }
        period_locked: { type: boolean }
        bill: { $ref: "#/components/schemas/BillRecord" }
        related: { $ref: "#/components/schemas/BillRelated" }
        chain:
          description: The bill and its letters, when it has any.
          type: object
          required: [root_id, members]
          properties:
            root_id: { type: string, format: uuid }
            members:
              type: array
              items: { $ref: "#/components/schemas/BillChainMember" }
        suggested_bill: { $ref: "#/components/schemas/BillChainMember" }
        suggested_letters:
          type: array
          items: { $ref: "#/components/schemas/BillChainMember" }
        logo: { type: [string, "null"] }

    BillsDue:
      type: object
      required: [currency, count, total_cents]
      properties:
        currency: { type: string }
        count: { type: integer }
        total_cents: { type: integer, format: int64 }

    BillsSummary:
      type: object
      required: [unpaid, overdue, due_soon, days, today]
      properties:
        unpaid: { type: integer, description: Bills not marked paid. }
        overdue: { type: integer, description: Unpaid bills past their due date. }
        due_soon:
          type: array
          description: Per currency, the unpaid bills due by today plus `days`, overdue ones included.
          items: { $ref: "#/components/schemas/BillsDue" }
        days: { type: integer }
        today: { type: string, format: date }

    BillsStats:
      type: object
      required: [month, totals, trend, top_senders, senders]
      properties:
        month: { type: string, description: "`YYYY-MM`" }
        totals:
          type: array
          items:
            type: object
            required: [currency, count, paid_count, total_cents, paid_cents]
            properties:
              currency: { type: string }
              count: { type: integer }
              paid_count: { type: integer }
              total_cents: { type: integer, format: int64 }
              paid_cents: { type: integer, format: int64 }
        trend:
          type: array
          description: Up to twelve months ending with `month`, per currency; months with no bills are absent.
          items:
            type: object
            required: [month, currency, count, total_cents]
            properties:
              month: { type: string }
              currency: { type: string }
              count: { type: integer }
              total_cents: { type: integer, format: int64 }
        top_senders:
          type: array
          items:
            type: object
            required: [name, count]
            properties:
              name: { type: string }
              currency: { type: string }
              count: { type: integer }
              total_cents: { type: integer, format: int64 }
              logo: { type: [string, "null"] }
        senders:
          type: array
          description: Everyone who has sent the household bills, most bills first.
          items:
            type: object
            required: [name, count]
            properties:
              name: { type: string }
              count: { type: integer }

    HeldEmailFile:
      type: object
      required: [id, filename, content_type, size_bytes]
      properties:
        id: { type: string, format: uuid }
        filename: { type: string }
        content_type: { type: string }
        size_bytes: { type: integer, format: int64 }

    HeldEmail:
      description: An email forwarded to the household that waits for approval.
      type: object
      required: [id, from_email, subject, status, created_at, sender, files]
      properties:
        id: { type: string, format: uuid }
        from_email: { type: string }
        subject: { type: string }
        status: { type: string }
        reason: { type: [string, "null"] }
        attachments: { type: integer }
        documents: { type: integer }
        created_at: { type: string, format: date-time }
        hold_reason:
          type: [string, "null"]
          enum: [new_sender, unverified_sender, no_plan, quota_used, null]
          description: Why it waits. The sender reasons wait for a person; the plan reasons clear by themselves.
        held_until: { type: [string, "null"], format: date-time, description: When it is deleted if nobody acts. }
        resolved_at: { type: [string, "null"], format: date-time }
        bounced: { type: boolean }
        forwarded_by: { type: [string, "null"], description: The household member whose forwarding rule passed it on. }
        original_from: { type: [string, "null"], description: "Who wrote it first, when forwarded by hand." }
        lookalike_of: { type: [string, "null"], description: A known domain this sender's imitates. }
        sender:
          type: string
          enum: [verified, failed, unknown]
          description: What the mail server found about the From address.
        files:
          type: array
          items: { $ref: "#/components/schemas/HeldEmailFile" }
        logo: { type: [string, "null"] }
